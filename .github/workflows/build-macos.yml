name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ff6d-sreon

jobs:
  dmg:
    name: Sreon macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Apple Silicon DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp release/*.dmg artifacts/
          shasum -a 256 artifacts/*.dmg > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Sreon-macOS-DMG
          path: artifacts/*
          if-no-files-found: error
