name: Build Slate DMG
on:
  workflow_dispatch:
  push:
    branches: [arena/01a103be-sreon]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Build, test, and package
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x scripts/build-dmg.sh
          scripts/build-dmg.sh 2>&1 | tee compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Slate-build
          path: |
            build/Slate.dmg
            compile.log
          if-no-files-found: error
      - name: Verify build
        if: steps.compile.outcome != 'success'
        run: |
          echo "::error title=Swift build failed::$(grep -B3 -E 'error:|failed|XCTAssert' compile.log | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 1
