name: Build Slate DMG
on:
  workflow_dispatch:
  push:
    branches: [arena/01a103be-sreon]
    paths-ignore: [artifacts/**]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Build, test, and package
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x scripts/build-dmg.sh
          scripts/build-dmg.sh 2>&1 | tee compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Slate-build
          path: |
            build/Slate.dmg
            compile.log
          if-no-files-found: error
      - name: Publish DMG to branch
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p artifacts
          cp build/Slate.dmg artifacts/Slate.dmg
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f artifacts/Slate.dmg
          git commit -m "Attach verified Slate DMG [skip ci]"
          git push origin HEAD:arena/01a103be-sreon
      - name: Verify build
        if: steps.compile.outcome != 'success'
        run: |
          grep -B4 -A2 -E 'error:|failed|XCTAssert' compile.log | tail -60 > errors.txt
          echo "::error title=Swift build failed::BASE64_$(head -c 2500 errors.txt | base64 | tr -d '\n')"
          exit 1
