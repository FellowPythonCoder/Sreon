[package]
name = "sreon"
version = "1.0.0"
edition = "2021"
description = "Sreon — a calm, private desktop browser shell."
authors = ["Sreon"]
license = "MIT"
readme = "../README.md"

[dependencies]
eframe = { version = "0.30.0", default-features = true }
egui = "0.30.0"
open = "5.1.3"
urlencoding = "2.1.3"
directories = "5.0.1"
raw-window-handle = "0.6.2"
wry = "0.47.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.bundle]
name = "Sreon"
identifier = "com.sreon.browser"
description = "A little more room to explore."
icon = ["assets/sreon.png"]
category = "public.app-category.utilities"
osx_minimum_system_version = "11.0"

[package.metadata.deb]
maintainer = "Sreon"
section = "net"
priority = "optional"
assets = [["target/release/sreon", "usr/bin/sreon", "755"], ["assets/sreon.png", "usr/share/icons/hicolor/512x512/apps/sreon.png", "644"], ["packaging/sreon.desktop", "usr/share/applications/sreon.desktop", "644"]]

[package.metadata.rpm]
package = "sreon"
summary = "A calm, private desktop browser shell"
assets = [{ source = "target/release/sreon", dest = "/usr/bin/sreon", mode = "755" }]
