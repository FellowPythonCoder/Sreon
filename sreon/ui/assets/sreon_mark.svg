<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Glassmorphic Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1c1924" />
      <stop offset="60%" stop-color="#0e0d13" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    
    <!-- Vivid Sreon Orange Gradients -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E40" />
      <stop offset="45%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D94800" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="60%" stop-color="#FFA834" />
      <stop offset="100%" stop-color="#FFD182" />
    </linearGradient>

    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FF6B00" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#1F1F28" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.1" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Base / macOS App Icon Plate -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGlow)" stroke="url(#glassRim)" stroke-width="3" />

  <!-- Ambient Orange Glow behind Emblem -->
  <circle cx="256" cy="256" r="140" fill="#FF6B00" opacity="0.16" filter="url(#ambientLight)" />

  <!-- Outer Orbital Navigation Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FF6B00" stroke-width="3.5" stroke-opacity="0.22" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="#FFA136" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Orbital Node Accents -->
  <circle cx="377" cy="135" r="4" fill="#FFA136" opacity="0.6" />
  <circle cx="135" cy="377" r="4" fill="#FF6B00" opacity="0.6" />
  <circle cx="256" cy="64" r="5" fill="#FFD182" opacity="0.8" />
  <circle cx="256" cy="448" r="5" fill="#D94800" opacity="0.8" />

  <!-- Speed Vectors / Left & Right Accent Rays -->
  <path d="M 88 236 L 148 236 M 72 256 L 132 256 M 88 276 L 148 276" stroke="#FFA136" stroke-width="3" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M 364 236 L 424 236 M 380 256 L 440 256 M 364 276 L 424 276" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-opacity="0.35" />

  <!-- The SREON Geometric "S" Nexus Mark -->
  <!-- Top Sweeping Wing -->
  <path d="M 368 124 C 330 94, 276 88, 224 104 C 172 120, 140 162, 146 212 C 150 244, 178 266, 214 278 L 298 306 C 330 316, 348 332, 344 354 C 338 382, 308 404, 268 406 C 220 408, 180 388, 154 354"
        fill="none" stroke="url(#orangeGlow)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Core Inner Flow Ribbons -->
  <path d="M 364 128 C 328 100, 280 94, 230 108 C 182 122, 154 160, 158 206 C 162 234, 186 254, 220 266 L 292 292 C 328 304, 342 322, 338 348 C 334 370, 310 392, 274 394 C 234 396, 196 378, 168 348"
        fill="none" stroke="url(#amberGlow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Speed Energy Core / Nexus Beacon -->
  <circle cx="256" cy="279" r="10" fill="#FFFFFF" opacity="0.9" filter="url(#softGlow)" />
  <circle cx="256" cy="279" r="5" fill="#FFB75E" />
</svg>
